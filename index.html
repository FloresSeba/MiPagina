<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. CUADRO NEGRO COMPLETO SUPERIOR -->
    <div class="barra-negra-superior"></div>
    
    <!-- 2. CUADRO GRANDE DE ABAJO (Contenedor principal) -->
    <main class="contenedor-principal-abajo">

        <!-- CUADRO DEL TÍTULO -->
        <header class="cuadro-titulo-interno">
            <p class="texto-parrafo-titulo">Mi Portafolio de Desarrollador</p>
        </header>

        <!-- PRIMER CUADRO DE TEXTO: NOMBRE Y APELLIDO -->
        <section class="cuadro-nombre-completo">
            <p><strong>Desarrollador:</strong> Sebastián Ignacio Flores Andrades</p>
        </section>

        <!-- EL CONTENEDOR MÁGICO: Este bloque obliga a separar la izquierda de la derecha -->
        <div class="bloque-dos-columnas">
            
            <!-- COLUMNA IZQUIERDA (Agrupa tus dos cuadros de texto actuales) -->
            <div class="columna-izquierda-textos">
                
                <!-- SEGUNDO CUADRO DE TEXTO: TÍTULOS -->
                <section class="cuadro-titulos-carreras">
                    <h3>Títulos & Carreras</h3>
                    <p>- Título de Asistente En Geología, Técnico De Nivel Medio</p>
                    <p>- Estudiando Ingeniería En Realidad Virtual Y Diseño De Juegos Digitales</p>
                </section>

                <!-- TERCER CUADRO DE TEXTO: TRABAJOS -->
                <section class="cuadro-trabajos">
                    <h3>Lugar De Estudio Superior</h3>
                    <p>- Universidad Bernardo O´Higgins</p>
                </section>

            </div>

            <!-- COLUMNA DERECHA (Aquí se mete el GIF para que flote a la derecha) -->
            <div class="columna-derecha-imagenes">
                <figure class="tarjeta-imagen">
                    <img src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExZnByZDdtb2FyN2phbmx4dnY0aTVrOGM5NTB4cXNjaWJleThld245ZyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/H5C8CevNMbpBqNqFjl/giphy.gif" alt=>
                </figure>
            </div>

        </div> <!-- AQUÍ TERMINA EL CONTENEDOR MÁGICO -->

    </main>

</body>
</html>
